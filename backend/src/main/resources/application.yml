spring:
  application:
    name: springboot-modulith-admin
  profiles:
    default: dev
  datasource:
    # all times are stored in UTC: the JDBC session time zone is forced to UTC regardless of the server/JVM zone
    url: jdbc:mysql://${DB_HOST:127.0.0.1}:${DB_PORT:3306}/${DB_NAME:springboot_modulith_admin}?useUnicode=true&characterEncoding=utf8&connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true&useSSL=false&allowPublicKeyRetrieval=true&rewriteBatchedStatements=true
    username: ${DB_USERNAME:springboot_modulith_admin}
    password: ${DB_PASSWORD:sma_dev}
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 21MB
  modulith:
    runtime:
      # module-scoped migrations: db/migration/__root and db/migration/<module>
      flyway-enabled: true
    events:
      jdbc:
        schema-initialization:
          # EVENT_PUBLICATION is created by Flyway (db/migration/__root/V1__event_publication.sql)
          enabled: false
      completion-mode: update
      # multi-instance safe: failed publications are resubmitted explicitly (admin page / FailedEventPublications)
      republish-outstanding-events-on-restart: false
      staleness:
        check-interval: PT1M
        published: PT10M
        processing: PT10M
        resubmitted: PT10M

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false
    db-config:
      id-type: assign_id
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

management:
  endpoints:
    web:
      exposure:
        include: health,info,modulith

server:
  port: 8080

sma:
  deployment:
    # migrate preserves single-node startup; validate never applies DDL on a serving node.
    schema-mode: ${SMA_DEPLOYMENT_SCHEMA_MODE:migrate}
    evidence:
      # Staged deployment qualification. Full multi-mode remains closed until P08 acceptance.
      enabled: ${SMA_DEPLOYMENT_EVIDENCE_ENABLED:false}
    storage:
      # Requires evidence enabled and all local resources declared shared; multi acceptance remains separate.
      enabled: ${SMA_DEPLOYMENT_STORAGE_ENABLED:false}
    traffic:
      # Requires evidence/storage plus the fixed readiness/liveness deployment configuration.
      enabled: ${SMA_DEPLOYMENT_TRAFFIC_ENABLED:false}
  security:
    source:
      # Telemetry only: does not extend tenant Host/Proto trust or change authentication budgets.
      trusted-proxies: ${SMA_SECURITY_SOURCE_TRUSTED_PROXIES:}
      maximum-hops: ${SMA_SECURITY_SOURCE_MAXIMUM_HOPS:16}
      maximum-header-characters: ${SMA_SECURITY_SOURCE_MAXIMUM_HEADER_CHARACTERS:2048}
    browser:
      allowed-origins: ${SMA_SECURITY_BROWSER_ALLOWED_ORIGINS:}
      maximum-json-bytes: ${SMA_SECURITY_BROWSER_MAXIMUM_JSON_BYTES:2097152}
      maximum-concurrent-json: ${SMA_SECURITY_BROWSER_MAXIMUM_CONCURRENT_JSON:16}
      maximum-concurrent-anonymous-json: ${SMA_SECURITY_BROWSER_MAXIMUM_CONCURRENT_ANONYMOUS_JSON:4}
    requests:
      # Deployment HMAC keys only; never user passwords or public parameter values.
      fingerprint-key: ${SMA_SECURITY_REQUESTS_FINGERPRINT_KEY:}
      fingerprint-key-id: ${SMA_SECURITY_REQUESTS_FINGERPRINT_KEY_ID:v1}
      previous-fingerprint-keys: ${SMA_SECURITY_REQUESTS_PREVIOUS_FINGERPRINT_KEYS:}
      max-records-per-tenant: ${SMA_SECURITY_REQUESTS_MAX_RECORDS_PER_TENANT:100000}
      max-concurrent: ${SMA_SECURITY_REQUESTS_MAX_CONCURRENT:8}
      minimum-write-interval: ${SMA_SECURITY_REQUESTS_MINIMUM_WRITE_INTERVAL:500ms}
  defense:
    maintenance:
      enabled: ${SMA_DEFENSE_MAINTENANCE_ENABLED:true}
      interval: ${SMA_DEFENSE_MAINTENANCE_INTERVAL:30s}
      tenant-batch: ${SMA_DEFENSE_MAINTENANCE_TENANT_BATCH:8}
    collection:
      # Explicit opt-in; per-node private spool and stable raw 32-byte key, never tenant provider credentials.
      enabled: ${SMA_DEFENSE_COLLECTION_ENABLED:false}
      directory: ${SMA_DEFENSE_COLLECTION_DIRECTORY:}
      key-file: ${SMA_DEFENSE_COLLECTION_KEY_FILE:}
      scope: ${SMA_DEFENSE_COLLECTION_SCOPE:}
      memory-records: ${SMA_DEFENSE_COLLECTION_MEMORY_RECORDS:1024}
      disk-records: ${SMA_DEFENSE_COLLECTION_DISK_RECORDS:10000}
      disk-bytes: ${SMA_DEFENSE_COLLECTION_DISK_BYTES:33554432}
      per-second: ${SMA_DEFENSE_COLLECTION_PER_SECOND:1000}
      batch: ${SMA_DEFENSE_COLLECTION_BATCH:32}
      retry-delay: ${SMA_DEFENSE_COLLECTION_RETRY_DELAY:5s}
    storage:
      maximum-platform-records: ${SMA_DEFENSE_MAXIMUM_PLATFORM_RECORDS:100000}
      maximum-tenant-records: ${SMA_DEFENSE_MAXIMUM_TENANT_RECORDS:100000}
      maximum-tenant-total-records: ${SMA_DEFENSE_MAXIMUM_TENANT_TOTAL_RECORDS:1000000}
      retention: ${SMA_DEFENSE_RETENTION:30d}
      cleanup-batch: ${SMA_DEFENSE_CLEANUP_BATCH:100}
  mail:
    dispatch:
      # Explicit deployment opt-in after tenant profiles, templates and SMTP egress routes are configured.
      enabled: ${SMA_MAIL_DISPATCH_ENABLED:false}
  rule:
    demo:
      # Synthetic, tenant-scoped demo objects only; never enables real business bindings.
      enabled: ${SMA_RULE_DEMO_ENABLED:false}
  common:
    credentials:
      # Deployment-owned encryption ring; tenant Google/mail/storage accounts live in their own tenant records.
      key-file: ${SMA_TENANT_CREDENTIAL_KEY_FILE:}
  cache:
    # local | redis | none. Redis requires a deployment-specific namespace and bounded server memory.
    provider: ${SMA_CACHE_PROVIDER:local}
    namespace: ${SMA_CACHE_NAMESPACE:sma}
    deployment-mode: single
    max-bytes: 67108864
    max-scopes: 10000
    ttl-jitter: 0.1
  extension:
    console:
      enabled: ${SMA_EXTENSION_CONSOLE_ENABLED:false}
      security-url: ${SMA_EXTENSION_CONSOLE_URL:}
      token-file: ${SMA_EXTENSION_CONSOLE_TOKEN_FILE:}
  auth:
    security:
      # Deployment-owned file; blank leaves enrollment/password setup unavailable, never bypasses existing MFA.
      key-file: ${SMA_AUTH_SECURITY_KEY_FILE:}
      issuer: SMA Admin
  openapi:
    master-key: ${SMA_APP_MASTER_KEY:}
  bootstrap:
    # Set for first startup only; blank means no automatic administrator creation.
    admin-password: ${SMA_ADMIN_PASSWORD:}
  i18n:
    # first supported locale is the default; Accept-Language selects among them
    supported-locales: zh-CN,en-US
    default-locale: zh-CN
    # used when a request carries no valid X-Time-Zone header
    default-time-zone: Asia/Shanghai

