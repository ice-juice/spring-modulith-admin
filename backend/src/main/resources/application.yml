spring:
  application:
    name: springboot-modulith-admin
  profiles:
    default: dev
  datasource:
    url: jdbc:mysql://${DB_HOST:127.0.0.1}:${DB_PORT:3306}/${DB_NAME:springboot_modulith_admin}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true&rewriteBatchedStatements=true
    username: ${DB_USERNAME:springboot_modulith_admin}
    password: ${DB_PASSWORD:sma_dev}
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  modulith:
    runtime:
      # module-scoped migrations: db/migration/__root and db/migration/<module>
      flyway-enabled: true
    events:
      jdbc:
        schema-initialization:
          # EVENT_PUBLICATION is created by Flyway (db/migration/__root/V1__event_publication.sql)
          enabled: false
      completion-mode: update
      # multi-instance safe: failed publications are resubmitted explicitly (admin page / FailedEventPublications)
      republish-outstanding-events-on-restart: false
      staleness:
        check-interval: PT1M
        published: PT10M
        processing: PT10M
        resubmitted: PT10M

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false
    db-config:
      id-type: assign_id
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

management:
  endpoints:
    web:
      exposure:
        include: health,info,modulith

server:
  port: 8080

