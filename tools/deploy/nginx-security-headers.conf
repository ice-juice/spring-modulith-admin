# Include at the server/location that actually serves the admin HTML.
# add_header inheritance changes when a child location declares add_header;
# include this file again in such locations. TLS/HSTS is deployment-specific.
add_header X-Content-Type-Options nosniff always;
add_header X-Frame-Options SAMEORIGIN always;
add_header Referrer-Policy no-referrer always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self'; worker-src 'self' blob:; frame-src 'self' https:; object-src 'none'; base-uri 'none'; frame-ancestors 'self'" always;
