# Test profile: integration tests use a dedicated database that is wiped (Flyway clean) once per JVM
# by com.sma.admin.support.CleanTestDatabaseListener before the first Spring context starts.
spring:
  datasource:
    url: ${SMA_TEST_DB_URL:jdbc:mysql://127.0.0.1:3306/springboot_modulith_admin_test?useUnicode=true&characterEncoding=utf8&connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true&useSSL=false&allowPublicKeyRetrieval=true&rewriteBatchedStatements=true}
    username: ${SMA_TEST_DB_USERNAME:springboot_modulith_admin}
    password: ${SMA_TEST_DB_PASSWORD:sma_dev}

sma:
  defense:
    maintenance:
      # Integration scenarios explicitly drive cleanup; never inherit deployment retention scheduling.
      enabled: false
  identity:
    email-maintenance:
      enabled: false
    login-maintenance:
      enabled: false
  cache:
    nodes:
      enabled: false
    tasks:
      dispatch:
        enabled: false
  mail:
    dispatch:
      # Tests explicitly drive local dispatch; do not inherit a deployment background-send opt-in.
      enabled: false
  tenant:
    bootstrap-hosts: localhost,127.0.0.1,[::1]
  auth:
    maintenance:
      enabled: false
    security:
      key-file: src/test/resources/auth-security-test.keys
  openapi:
    nonce-maintenance:
      enabled: false
    key-file: target/test-keys/openapi.key
  file:
    directory: ${sma.verify.directory:target}/test-storage

